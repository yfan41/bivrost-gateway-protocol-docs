name: Deploy docs

# Builds the Starlight site and rsyncs it over SSH to the web server so it is
# served at https://docs.bivrost.cn/gateway-protocol/ (base set via DOCS_BASE below).

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; let an in-flight deploy finish rather than cancel it
# (a half-synced docs tree is worse than a slightly stale one).
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CJK fonts
        # `playwright install --with-deps` installs shared libraries, not fonts.
        # Without Noto CJK the simplified-Chinese PDF renders entirely as tofu.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          test "$(fc-list :lang=zh | wc -l)" -gt 0 || { echo 'No CJK fonts installed'; exit 1; }

      - name: Install Chromium for Playwright
        # pnpm's allowBuilds policy keeps `pnpm install` from downloading browsers,
        # so fetch the revision this playwright expects here.
        run: pnpm exec playwright install --with-deps chromium

      - name: Build & deploy over SSH (rsync)
        # Publishes the protocol docs twice: the latest tree served in place at
        # /gateway-protocol/, and a frozen snapshot at /gateway-protocol/v<version>/.
        # DOCS_BASE (read by astro.config.mjs) rebases each build's URLs; VERSION at
        # the repo root is the single source of the version. pnpm build runs
        # starlight-links-validator; a broken link fails the build (and the deploy)
        # before anything is uploaded. The downloadable PDFs are rendered once from
        # the first build and published with both trees.
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          # Absolute path of the protocol docs' web root, a subdir dedicated to this
          # site. rsync --delete only wipes within this subdir, not the sibling
          # gateway/ site under the shared /var/www/docs.bivrost.cn root.
          DEPLOY_PATH: /var/www/docs.bivrost.cn/gateway-protocol
        run: |
          set -euo pipefail
          VER="$(cat VERSION)"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          PORT="${SSH_PORT:-22}"
          # Pin the host key at runtime (trust-on-first-use) so StrictHostKeyChecking
          # can stay on without maintaining a SSH_KNOWN_HOSTS secret.
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 644 "$HOME/.ssh/known_hosts"
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${PORT} -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          # 1) Latest — served in place at /gateway-protocol/. --exclude keeps
          #    --delete from wiping the sibling v<version>/ snapshot dirs (no content
          #    dir starts with /v<digit>).
          DOCS_BASE=/gateway-protocol pnpm build
          # Render the PDFs into dist/ before the first upload: the header's
          # download link is emitted by every build, so a PDF failure must block the
          # deploy rather than ship a 404.
          DOCS_BASE=/gateway-protocol pnpm run pdf
          mkdir -p "$RUNNER_TEMP/protocol-pdf"
          cp dist/*.pdf "$RUNNER_TEMP/protocol-pdf/"
          rsync -avz --delete --exclude '/v[0-9]*/' \
            -e "$SSH" dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

          # 2) Frozen snapshot at /gateway-protocol/v<version>/ (isolated subdir, plain --delete).
          # One render serves both trees: the filename comes from VERSION, the header
          # href is recomputed per build from BASE_URL, and every cross-reference
          # inside the PDF is a #fragment — nothing in it depends on the base path.
          DOCS_BASE="/gateway-protocol/v${VER}" pnpm build
          cp "$RUNNER_TEMP/protocol-pdf/"*.pdf dist/
          $SSH "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}/v${VER}'"
          rsync -avz --delete \
            -e "$SSH" dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/v${VER}/"

          # 3) Reload the Ask AI assistant's corpus. The proxy reads the llms-full.txt
          #    published above once at startup, so without this it keeps answering from
          #    the previous deploy's docs. Best-effort: a successful docs publish must
          #    not be failed by the assistant being down, absent, or not restartable by
          #    this deploy user — the run is annotated instead.
          if ! $SSH "${SSH_USER}@${SSH_HOST}" "systemctl restart bivrost-ai-proxy"; then
            echo "::warning::Ask AI proxy restart failed; it will keep serving the previous docs corpus"
          fi
