name: Publish docs

# Builds the Starlight site and publishes it as a GitHub Release. The web server
# polls that release and installs it itself, so it ends up served at
# https://docs.bivrost.cn/gateway-protocol/ (base set via DOCS_BASE below).
#
# Deploys are pull-based: this workflow never connects to the server. The push
# model it replaced needed a root SSH key in CI, and its rsync kept being dropped
# by the server's sshd — first by MaxStartups throttling under a brute-force
# flood, then by fail2ban banning the runner outright.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time; let an in-flight run finish rather than cancel it, so
# release assets are never replaced halfway.
concurrency:
  group: publish-docs
  cancel-in-progress: false

# Creating and updating the release is the only write this workflow needs.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A hung step (apt mirror stalling, ssh with no response) must cost minutes,
    # not the 6-hour default — a stuck run also blocks the deploy-docs concurrency
    # group, so every later push queues behind it.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CJK fonts
        # `playwright install --with-deps` installs shared libraries, not fonts.
        # Without Noto CJK the simplified-Chinese PDF renders entirely as tofu.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # The runner image points apt at azure.archive.ubuntu.com, which stalls
          # for minutes at a time and has failed this step outright. Drop it so
          # fetches go straight to the canonical mirror, then bound and retry.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            grep -q . /etc/apt/apt-mirrors.txt \
              || echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          APT_OPTS='-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
          for attempt in 1 2 3; do
            if sudo apt-get $APT_OPTS update \
               && sudo apt-get $APT_OPTS install -y --no-install-recommends fonts-noto-cjk; then
              break
            fi
            echo "::warning::apt attempt $attempt failed; retrying"
            sleep 5
          done
          fc-cache -f
          test "$(fc-list :lang=zh | wc -l)" -gt 0 || { echo 'No CJK fonts installed'; exit 1; }

      - name: Install Chromium for Playwright
        # pnpm's allowBuilds policy keeps `pnpm install` from downloading browsers,
        # so fetch the revision this playwright expects here.
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Build & package
        # Builds the protocol docs twice: the latest tree served in place at
        # /gateway-protocol/, and a frozen snapshot at /gateway-protocol/v<version>/.
        # DOCS_BASE (read by astro.config.mjs) rebases each build's URLs; VERSION at
        # the repo root is the single source of the version. pnpm build runs
        # starlight-links-validator; a broken link fails the build (and so the
        # release) before anything is published. The downloadable PDFs are rendered
        # once from the first build and shipped with both trees.
        run: |
          set -euo pipefail
          VER="$(cat VERSION)"

          # 1) Latest — the tree the server rsyncs into /gateway-protocol/ itself.
          DOCS_BASE=/gateway-protocol pnpm build
          # Render the PDFs into dist/ before packaging: the header's download link
          # is emitted by every build, so a PDF failure must block the release
          # rather than ship a 404.
          DOCS_BASE=/gateway-protocol pnpm run pdf
          mkdir -p "$RUNNER_TEMP/protocol-pdf" pkg
          cp dist/*.pdf "$RUNNER_TEMP/protocol-pdf/"
          tar -C dist -czf pkg/site-latest.tar.gz .

          # 2) Frozen snapshot for /gateway-protocol/v<version>/.
          # One render serves both trees: the filename comes from VERSION, the header
          # href is recomputed per build from BASE_URL, and every cross-reference
          # inside the PDF is a #fragment — nothing in it depends on the base path.
          DOCS_BASE="/gateway-protocol/v${VER}" pnpm build
          cp "$RUNNER_TEMP/protocol-pdf/"*.pdf dist/
          tar -C dist -czf pkg/site-versioned.tar.gz .

          # The server reads VERSION from here to name the snapshot directory, so it
          # is checksummed alongside the payloads rather than trusted.
          printf 'VERSION=%s\nCOMMIT=%s\n' "$VER" "$GITHUB_SHA" > pkg/manifest.env
          ( cd pkg && sha256sum manifest.env site-latest.tar.gz site-versioned.tar.gz > SHA256SUMS )
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Publish release
        # The web server polls this release and installs it itself (systemd
        # docs-pull@gateway-protocol on tb). Nothing in this workflow connects to
        # the server: no SSH key in CI, and no inbound port for a runner IP to be
        # banned on. The server keys off the SHA256SUMS content rather than the tag,
        # so re-releasing the same VERSION still deploys.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: v${{ env.VER }}
          body: |
            Protocol docs v${{ env.VER }} — built from ${{ github.sha }}.
            Installed automatically by `docs-pull@gateway-protocol` on the web server.
          files: |
            pkg/manifest.env
            pkg/site-latest.tar.gz
            pkg/site-versioned.tar.gz
            pkg/SHA256SUMS
          # Docs ship more often than VERSION changes, so a release for this tag
          # usually already exists; replace its assets in place.
          make_latest: true
